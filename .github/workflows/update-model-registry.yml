name: Update model-registry release asset

on:
  push:
    branches: [release]
    paths:
      - installer/model-registry.json
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Upload model-registry.json to stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload stable installer/model-registry.json \
            --clobber \
            --repo ${{ github.repository }}
